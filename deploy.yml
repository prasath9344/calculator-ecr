name: Deploy to EC2 with Docker

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Copy code to EC2
    - name: Copy project to EC2
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "~/myapp"

    # 3️⃣ Build & deploy Docker on EC2
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/myapp
          # Docker installation check
          if ! command -v docker &> /dev/null
          then
            echo "Docker not found. Installing..."
            sudo apt update && sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
          fi
          # ✅ Build Docker image with sudo
          sudo docker build -t myapp:latest .
          # ✅ Stop/remove old container (ignore errors if not exists)
          sudo docker stop myapp || true
          sudo docker rm myapp || true
          # ✅ Run new container with sudo
          sudo docker run -d -p 80:3000 --restart=always --name myapp myapp:latest
